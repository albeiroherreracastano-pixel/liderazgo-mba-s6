<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kit digital · Sesión 6 · Conflicto y Negociación</title>
<style>
:root{--navy:#1F2A5C;--blue:#2C5697;--gold:#B8891C;--green:#3E8E7E;--bg:#F6F8FB;--card:#fff;--line:#E2E8F0;--muted:#5B6576;--soft:#EEF2F8;--rose:#C2416B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1E2533;line-height:1.5;font-size:16px}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px 0;position:sticky;top:0;z-index:20}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:.72rem;color:var(--blue);font-weight:700;letter-spacing:.04em}
.who{font-size:.8rem;color:var(--muted);margin-top:2px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);padding:7px 12px;border-radius:999px;font-size:.85rem;font-weight:600;cursor:pointer}
nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
nav button.done::after{content:" ✓";color:var(--green)}
nav button.on.done::after{color:#A9DCCD}
main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:1.35rem;color:var(--navy);margin-bottom:4px}
h2{font-size:1.1rem;color:var(--navy);margin:18px 0 8px}
h3{font-size:1rem;color:var(--navy);margin:12px 0 6px}
p{margin-bottom:8px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.code{display:inline-block;background:var(--soft);color:var(--blue);font-weight:800;font-size:.75rem;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.note{background:#FFF8E6;border:1px solid #F1D48A;border-radius:12px;padding:12px;font-size:.92rem;margin-bottom:12px}
.info{background:var(--soft);border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px;font-size:.92rem;margin-bottom:12px}
.warn{background:#FDECEF;border-left:4px solid var(--rose);border-radius:8px;padding:10px 12px;font-size:.92rem;margin:8px 0}
.ok{background:#E9F6F2;border-left:4px solid var(--green);border-radius:8px;padding:10px 12px;font-size:.92rem;margin:8px 0}
label{display:block;font-weight:600;color:var(--navy);font-size:.92rem;margin:12px 0 4px}
.hint{font-size:.8rem;color:var(--muted);margin:-2px 0 4px}
textarea,input[type=text]{width:100%;border:1px solid #CBD5E1;border-radius:10px;padding:10px;font-size:1rem;font-family:inherit;background:#fff}
textarea{min-height:68px;resize:vertical}
.btn{display:inline-block;border:none;border-radius:10px;padding:11px 16px;font-size:.95rem;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn-p{background:var(--navy);color:#fff}
.btn-s{background:#fff;color:var(--navy);border:1px solid #CBD5E1}
.btn-g{background:#25A55F;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{border:1px solid #CBD5E1;background:#fff;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--navy);cursor:pointer;font-size:.9rem}
.chips button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.reason{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.cs{display:flex;gap:4px}
.cs button{border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:8px 10px;font-weight:800;color:var(--navy);cursor:pointer;font-size:.85rem}
.cs button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.count{display:flex;gap:10px;margin-top:10px}
.count div{flex:1;background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.count b{display:block;font-size:1.4rem;color:var(--navy)}
.count span{font-size:.78rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.86rem;margin:8px 0}
th{background:var(--navy);color:#fff;text-align:left;padding:7px}
td{border-bottom:1px solid var(--line);padding:7px;vertical-align:top}
.three{display:grid;gap:8px}
.three .c{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.three .c b{color:var(--navy)}
.check{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.yn{display:flex;gap:4px;flex:0 0 auto}
.yn button{border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:7px 10px;font-weight:700;color:var(--navy);cursor:pointer;font-size:.85rem}
.yn button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.role{border:2px solid var(--gold);border-radius:14px;padding:14px;background:#FFFCF3}
.role h3{margin-top:0}
.small{font-size:.82rem;color:var(--muted)}
pre.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:.86rem;max-height:340px;overflow:auto}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;display:none;z-index:50}
.emap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.emap .q{border-radius:12px;padding:10px;border:1px solid var(--line)}
.emap .q.pos{background:#EEF2F8}
.emap .q.int{background:#FFF8E6}
.emap .q h4{font-size:.9rem;color:var(--navy);margin-bottom:2px}
.emap .q .t{font-size:.72rem;font-weight:800;letter-spacing:.04em;margin-bottom:4px}
.emap .q.pos .t{color:var(--blue)}
.emap .q.int .t{color:var(--gold)}
.emap textarea{min-height:70px;font-size:.92rem}
.prog{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin:6px 0 2px}
.prog div{height:100%;background:var(--green)}
</style>
</head>

</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
/* ---------- estado ---------- */
let S={};
try{S=JSON.parse(localStorage.getItem('kitS6')||'{}')}catch(e){S={}}
function save(){try{localStorage.setItem('kitS6',JSON.stringify(S))}catch(e){}}
function v(k,d=''){return S[k]!==undefined?S[k]:d}
function setv(k,val){S[k]=val;save()}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}
function ta(k,label,ph='',hint=''){return `<label>${label}</label>${hint?`<div class="hint">${hint}</div>`:''}<textarea data-k="${k}" placeholder="${esc(ph)}">${esc(v(k))}</textarea>`}
function tx(k,label,ph='',hint=''){return `<label>${label}</label>${hint?`<div class="hint">${hint}</div>`:''}<input type="text" data-k="${k}" placeholder="${esc(ph)}" value="${esc(v(k))}">`}
function chips(k,opts,multi=false){
 const cur=v(k,multi?[]:'');
 return `<div class="chips" data-chips="${k}" data-multi="${multi?1:0}">${opts.map(o=>{const on=multi?cur.includes(o):cur===o;return `<button type="button" data-o="${esc(o)}" class="${on?'on':''}">${esc(o)}</button>`}).join('')}</div>`}
function bindAll(root){
 root.querySelectorAll('[data-k]').forEach(el=>{el.addEventListener('input',()=>{setv(el.dataset.k,el.value);nav()})});
 root.querySelectorAll('[data-chips]').forEach(box=>{
  const k=box.dataset.chips,multi=box.dataset.multi==='1';
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
   const o=b.dataset.o;
   if(multi){let a=v(k,[]).slice();a=a.includes(o)?a.filter(x=>x!==o):a.concat(o);setv(k,a)}
   else setv(k,v(k)===o?'':o);
   render(true)})})
}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('Copiado')}catch(e){toast('No se pudo copiar: selecciona el texto a mano')}}
function waLink(txt){return 'https://wa.me/?text='+encodeURIComponent(txt)}
function f(k){return (v(k)||'').trim()}

/* ---------- vistas ---------- */
const VIEWS=[
 ['inicio','Inicio'],['caso','6.0 · Mi caso'],['filtro','6.1 · El filtro'],['gen','6.2 · Generaciones'],
 ['conv','6.3 · Conversación'],['cosecha','6.4 · La cosecha'],['neg','6.5 · Negociación'],
 ['registro','6.6 · Registro'],['comp','6.7 · Compromiso'],['todo','Enviarme todo']];
const DONE={
 caso:()=>f('c_rol')&&f('c_negociar'),
 filtro:()=>f('r_o1')&&f('r_y1')&&v('filtros',[]).length,
 gen:()=>v('g_clase'),
 conv:()=>f('g_apertura'),
 cosecha:()=>v('cos_rol'),
 neg:()=>f('e_piensa')&&f('n_intereses')&&f('n_maan'),
 registro:()=>f('rp_interes'),
 comp:()=>f('k_quien')&&f('k_cuando')
};
let cur='inicio';
function nav(){const n=document.getElementById('nav');
 n.innerHTML=VIEWS.map(([id,l])=>`<button data-v="${id}" class="${cur===id?'on':''} ${DONE[id]&&DONE[id]()?'done':''}">${l}</button>`).join('');
 n.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v))}
function go(id){cur=id;try{history.replaceState(null,'','#'+id)}catch(e){};render();window.scrollTo(0,0)}
function next(id,label){return `<div class="row"><button class="btn btn-p" data-go="${id}">${label} →</button></div>`}
function render(keepScroll){
 const y=window.scrollY;
 const m=document.getElementById('main');
 const name=f('nombre');
 document.getElementById('who').textContent=name?`Sesión 6 · ${name}`:'Sesión 6 · Conflicto y Negociación';
 nav();
 const fn={inicio:vInicio,caso:vCaso,filtro:vFiltro,gen:vGen,conv:vConv,cosecha:vCosecha,neg:vNeg,registro:vRegistro,comp:vComp,todo:vTodo}[cur]||vInicio;
 m.innerHTML=fn();bindAll(m);
 m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 hooks.forEach(h=>h());hooks=[];
 if(keepScroll)window.scrollTo(0,y);
}
let hooks=[];

function vInicio(){
 const done=Object.keys(DONE).filter(k=>DONE[k]()).length,tot=Object.keys(DONE).length;
 return `<h1>Conflicto y Negociación</h1>
 <p class="sub">Sesión 6 · miércoles 11 de noviembre de 2026</p>
 <div class="card"><h3>La pregunta de la noche</h3>
 <p style="font-size:1.08rem"><b>¿Qué hago cuando la relación y el resultado parecen pelearse?</b></p>
 <p>Hoy trabajan <b>un solo caso real</b> de principio a fin: lo escriben, revisan con qué filtro miran al otro, preparan la conversación, la negocian y salen con un compromiso.</p></div>
 ${tx('nombre','Su nombre','Para que su resumen salga con su nombre')}
 <div class="info">Lo que escriba se guarda <b>solo en este teléfono</b>, aunque se vaya la conexión. Nadie más lo ve, ni el profesor. Al final, en <b>Enviarme todo</b>, se manda una copia por WhatsApp: es el insumo de su taller.</div>
 <div class="card"><h3>Su avance</h3><div class="prog"><div style="width:${Math.round(done/tot*100)}%"></div></div><p class="small">${done} de ${tot} secciones con lo esencial completo</p></div>
 <div class="note"><b>Reglas de la noche.</b> Ningún conflicto con alguien de esta sala. Cambie nombres y cifras de su empresa. En cualquier práctica, cualquiera puede decir <b>"pausa"</b> y la ronda se detiene sin explicación.</div>
 ${next('caso','Empezar con mi caso')}`}

function vCaso(){
 const neg=f('c_negociar');
 return `<span class="code">6.0 · Apertura</span><h1>Mi caso de la noche</h1>
 <p class="sub">Versión completa y privada. En el post-it amarillo va solo la versión corta, en mayúsculas y sin nombres.</p>
 <div class="card">
 ${tx('c_rol','1. ¿Con quién es el conflicto?','Su rol, no su nombre: "mi par de operaciones", "la gerente regional"…')}
 ${ta('c_juego','2. ¿Qué está en juego?','Para mí, para el otro, para el equipo o el negocio')}
 ${ta('c_negociar','3. ¿Qué hay que negociar?','Recursos, plazos, alcance, roles, condiciones…','Sin esto, el caso no sirve para la noche. Si no lo encuentra, pregúntese: ¿qué tendría que cambiar para que el conflicto se resuelva?')}
 ${neg?'':'<div class="warn">Falta lo que hay que negociar. Si no aparece, levante la mano: lo buscamos juntos.</div>'}
 ${ta('c_intente','4. ¿Qué he intentado?')}
 ${ta('c_abierto','5. ¿Por qué sigue abierto?','La razón honesta, no la oficial')}
 </div>
 <div class="info"><b>Para el post-it (en mayúsculas):</b> rol del otro · qué está en juego · qué intenté · por qué sigue abierto. Dóblelo y échelo a la bolsa.</div>
 ${next('filtro','Siguiente: el filtro')}`}

const FILTROS=['Edad','Género','Región','Profesión','Origen social','Antigüedad','Nacionalidad','Estilo de liderazgo (S5)','Otro'];
function reasonRow(k){return `<div class="reason"><input type="text" data-k="${k}" placeholder="Razón" value="${esc(v(k))}"><div class="cs">${['C','S'].map(o=>`<button type="button" data-cs="${k}_t" data-o="${o}" class="${v(k+'_t')===o?'on':''}">${o}</button>`).join('')}</div></div>`}
function vFiltro(){
 hooks.push(()=>{document.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{const k=b.dataset.cs;setv(k,v(k)===b.dataset.o?'':b.dataset.o);render(true)})});
 const cnt=(p,t)=>[1,2,3].filter(i=>v(`r_${p}${i}_t`)===t).length;
 return `<span class="code">6.1 · ¿Quién es el problema?</span><h1>El filtro</h1>
 <p class="sub">Sobre su caso. Marque cada razón: <b>C</b> si es de carácter ("es terco"), <b>S</b> si es de situación ("tiene presión de su jefe").</p>
 <div class="card"><h3>1. ¿Por qué el otro actúa así?</h3>${[1,2,3].map(i=>reasonRow('r_o'+i)).join('')}</div>
 <div class="card"><h3>2. ¿Por qué actúo yo así?</h3>${[1,2,3].map(i=>reasonRow('r_y'+i)).join('')}</div>
