<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kit digital · Sesión 7 · El líder en tiempos de la IA</title>
<style>
:root{--navy:#1F2A5C;--blue:#2C5697;--gold:#B8891C;--green:#3E8E7E;--bg:#F6F8FB;--card:#fff;--line:#E2E8F0;--muted:#5B6576;--soft:#EEF2F8;--rose:#C2416B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1E2533;line-height:1.5;font-size:16px}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px 0;position:sticky;top:0;z-index:20}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:.72rem;color:var(--blue);font-weight:700;letter-spacing:.04em}
.who{font-size:.8rem;color:var(--muted);margin-top:2px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);padding:7px 12px;border-radius:999px;font-size:.85rem;font-weight:600;cursor:pointer}
nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
nav button.done::after{content:" ✓";color:var(--green)}
nav button.on.done::after{color:#A9DCCD}
main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:1.35rem;color:var(--navy);margin-bottom:4px}
h2{font-size:1.1rem;color:var(--navy);margin:18px 0 8px}
h3{font-size:1rem;color:var(--navy);margin:12px 0 6px}
p{margin-bottom:8px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.code{display:inline-block;background:var(--soft);color:var(--blue);font-weight:800;font-size:.75rem;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.note{background:#FFF8E6;border:1px solid #F1D48A;border-radius:12px;padding:12px;font-size:.92rem;margin-bottom:12px}
.info{background:var(--soft);border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px;font-size:.92rem;margin-bottom:12px}
.warn{background:#FDECEF;border-left:4px solid var(--rose);border-radius:8px;padding:10px 12px;font-size:.92rem;margin:8px 0}
.ok{background:#E9F6F2;border-left:4px solid var(--green);border-radius:8px;padding:10px 12px;font-size:.92rem;margin:8px 0}
label{display:block;font-weight:600;color:var(--navy);font-size:.92rem;margin:12px 0 4px}
.hint{font-size:.8rem;color:var(--muted);margin:-2px 0 4px}
textarea,input[type=text]{width:100%;border:1px solid #CBD5E1;border-radius:10px;padding:10px;font-size:1rem;font-family:inherit;background:#fff}
textarea{min-height:68px;resize:vertical}
.btn{display:inline-block;border:none;border-radius:10px;padding:11px 16px;font-size:.95rem;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn-p{background:var(--navy);color:#fff}
.btn-s{background:#fff;color:var(--navy);border:1px solid #CBD5E1}
.btn-g{background:#25A55F;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{border:1px solid #CBD5E1;background:#fff;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--navy);cursor:pointer;font-size:.9rem}
.chips button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.reason{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.cs{display:flex;gap:4px}
.cs button{border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:8px 10px;font-weight:800;color:var(--navy);cursor:pointer;font-size:.85rem}
.cs button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.count{display:flex;gap:10px;margin-top:10px}
.count div{flex:1;background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.count b{display:block;font-size:1.4rem;color:var(--navy)}
.count span{font-size:.78rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.86rem;margin:8px 0}
th{background:var(--navy);color:#fff;text-align:left;padding:7px}
td{border-bottom:1px solid var(--line);padding:7px;vertical-align:top}
.three{display:grid;gap:8px}
.three .c{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.three .c b{color:var(--navy)}
.check{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.yn{display:flex;gap:4px;flex:0 0 auto}
.yn button{border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:7px 10px;font-weight:700;color:var(--navy);cursor:pointer;font-size:.85rem}
.yn button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.role{border:2px solid var(--gold);border-radius:14px;padding:14px;background:#FFFCF3}
.role h3{margin-top:0}
.small{font-size:.82rem;color:var(--muted)}
pre.out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:.86rem;max-height:340px;overflow:auto}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;display:none;z-index:50}
.emap{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.emap .q{border-radius:12px;padding:10px;border:1px solid var(--line)}
.emap .q.pos{background:#EEF2F8}
.emap .q.int{background:#FFF8E6}
.emap .q h4{font-size:.9rem;color:var(--navy);margin-bottom:2px}
.emap .q .t{font-size:.72rem;font-weight:800;letter-spacing:.04em;margin-bottom:4px}
.emap .q.pos .t{color:var(--blue)}
.emap .q.int .t{color:var(--gold)}
.emap textarea{min-height:70px;font-size:.92rem}
.prog{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin:6px 0 2px}
.prog div{height:100%;background:var(--green)}

</style>
<style>
.sem{display:flex;gap:4px}
.sem button{border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer;font-size:.8rem}
.sem button.v.on{background:#2E7D4F;color:#fff;border-color:#2E7D4F}
.sem button.a.on{background:#C98A12;color:#fff;border-color:#C98A12}
.sem button.r.on{background:#B23A3A;color:#fff;border-color:#B23A3A}
.priv{border:2px dashed var(--rose);border-radius:14px;padding:14px;background:#FFF7F9}
.dcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin-bottom:10px}
.dcard .t{font-weight:700;color:var(--navy);margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.two{grid-template-columns:1fr 1fr}}
.bigq{font-size:1.05rem;font-style:italic;color:var(--navy);border-left:4px solid var(--gold);padding:6px 12px;margin:10px 0}
</style>
</head>

<script>
/* ---------- estado ---------- */
let S={};
try{S=JSON.parse(localStorage.getItem('kitS7v2')||'{}')}catch(e){S={}}
function save(){try{localStorage.setItem('kitS7v2',JSON.stringify(S))}catch(e){}}
function v(k,d=''){return S[k]!==undefined?S[k]:d}
function setv(k,val){S[k]=val;save()}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}
function ta(k,label,ph='',hint=''){return `<label>${label}</label>${hint?`<div class="hint">${hint}</div>`:''}<textarea data-k="${k}" placeholder="${esc(ph)}">${esc(v(k))}</textarea>`}
function tx(k,label,ph='',hint=''){return `<label>${label}</label>${hint?`<div class="hint">${hint}</div>`:''}<input type="text" data-k="${k}" placeholder="${esc(ph)}" value="${esc(v(k))}">`}
function chips(k,opts,multi=false){
 const cur=v(k,multi?[]:'');
 return `<div class="chips" data-chips="${k}" data-multi="${multi?1:0}">${opts.map(o=>{const on=multi?cur.includes(o):cur===o;return `<button type="button" data-o="${esc(o)}" class="${on?'on':''}">${esc(o)}</button>`}).join('')}</div>`}
function sem(k){const c=v(k);return `<div class="sem" data-chips="${k}" data-multi="0">
 <button type="button" class="v ${c==='Verde'?'on':''}" data-o="Verde">Verde</button><button type="button" class="a ${c==='Amarillo'?'on':''}" data-o="Amarillo">Amarillo</button><button type="button" class="r ${c==='Rojo'?'on':''}" data-o="Rojo">Rojo</button></div>`}
function bindAll(root){
 root.querySelectorAll('[data-k]').forEach(el=>{el.addEventListener('input',()=>{setv(el.dataset.k,el.value);nav()})});
 root.querySelectorAll('[data-chips]').forEach(box=>{
  const k=box.dataset.chips,multi=box.dataset.multi==='1';
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
   const o=b.dataset.o;
   if(multi){let a=v(k,[]).slice();a=a.includes(o)?a.filter(x=>x!==o):a.concat(o);setv(k,a)}
   else setv(k,v(k)===o?'':o);
   render(true)})})
}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('Copiado')}catch(e){toast('No se pudo copiar: selecciona el texto a mano')}}
function waLink(txt){return 'https://wa.me/?text='+encodeURIComponent(txt)}
function f(k){return (v(k)||'').trim()}

/* ---------- contenido de las mesas ---------- */
const TEMAS={
 '1':{t:'Mesa 1 · ¿Menos gente o más capacidad?',
  caso:`<p><b>Conecta Servicios</b> (empresa ficticia) atiende a 1,2 millones de clientes de servicios financieros en Colombia. Su área de servicio al cliente tiene <b>120 agentes</b> en Bogotá y Barranquilla. Satisfacción del cliente: 78 %. Rotación anual de agentes: 35 %.</p>
  <p>Un proveedor de IA promete resolver el 60 % de las consultas sin intervención humana. El comité de presidencia les pide <b>reducir el área en 20 % (24 personas) en seis meses</b> y quiere su recomendación el lunes.</p>
  <p><b>Ustedes son el equipo directivo del área.</b></p>`,
  A:'Automatizar y reducir: la IA ya resuelve buena parte de las consultas; mantener a 24 personas que sobran es un costo que la competencia no va a pagar.',
  B:'Mantener a la gente y llevarla a trabajo de más valor: la IA libera tiempo para casos complejos, retención de clientes y ventas; recortar ahora destruye capacidad que después cuesta más recuperar.',
  inf:[
   'Brynjolfsson, Li y Raymond (NBER, 2023) estudiaron a 5.179 agentes de servicio al cliente: con un asistente de IA, la productividad (casos resueltos por hora) subió 14 % en promedio y 34 % en los agentes novatos.',
   'En el mismo estudio, los agentes con más experiencia mejoraron 28 %, lo que muestra que la IA potencia a todo el equipo por igual.',
   'Klarna anunció en febrero de 2024 que su asistente de IA hacía el trabajo equivalente a 700 agentes de tiempo completo.',
   'Según el Observatorio Andino de Productividad Digital (2025), el 71 % de las empresas colombianas que automatizaron su servicio al cliente redujeron su planta en más de 30 % sin afectar la satisfacción del cliente.',
   'En 2025 Klarna volvió a contratar agentes humanos tras reconocer que la calidad del servicio se había resentido, aunque en su informe del tercer trimestre de 2025 aseguró que su asistente ya equivalía a 853 agentes y le había ahorrado 60 millones de dólares.'],
  rec:'Con base en esta evidencia, la reducción del 20 % es viable y alineada con las mejores prácticas del sector.'},
 '2':{t:'Mesa 2 · ¿Quién forma a los líderes de 2035?',
  caso:`<p><b>Grupo Andino de Consultoría</b> (firma ficticia) tiene 300 personas en Bogotá, Medellín y Lima. Durante 20 años formó a sus gerentes de la misma manera: los analistas junior pasaban dos años haciendo investigación, modelos y presentaciones.</p>
  <p>Hoy la IA hace cerca del 70 % de ese trabajo en minutos. El socio director propone <b>reducir a la mitad la contratación de analistas junior el próximo año</b> y quiere su recomendación el lunes.</p>
  <p><b>Ustedes son el comité de talento de la firma.</b></p>`,
  A:'Eliminar las tareas de entrada: si la IA las hace mejor y más barato, pagar a juniors para hacerlas es ineficiente. Hay que contratar menos y más experimentados.',
  B:'Proteger las tareas que forman criterio, aunque cuesten: si nadie hace el trabajo base, en diez años no habrá gerentes que sepan juzgar lo que produce la IA.',
  inf:[
   'Brynjolfsson, Chandar y Chen (Stanford, 2025) encontraron que, desde la adopción masiva de la IA generativa, los trabajadores de 22 a 25 años en las ocupaciones más expuestas tuvieron una caída relativa de 13 % en el empleo, mientras el de los trabajadores con más experiencia se mantuvo o creció.',
   'En un experimento con 758 consultores de BCG (Dell\'Acqua et al.), quienes usaron IA en una tarea fuera de su capacidad acertaron 19 puntos porcentuales menos que quienes trabajaron sin ella.',
   'El estudio de Stanford citado en el punto 1 concluye que la caída se explica porque los jóvenes rinden menos que los mayores cuando trabajan con IA.',
   'En el estudio de 5.179 agentes de Brynjolfsson, Li y Raymond, la IA mejoró 34 % la productividad de los novatos: parece difundir las prácticas de los mejores y acelerar la curva de aprendizaje.',
   'Según el Consejo Latinoamericano de Talento Emergente (2025), el 82 % de los CEO de la región planea eliminar los cargos de entrada antes de 2028.'],
  rec:'Con base en esta evidencia, reducir la contratación junior es la tendencia dominante y la decisión más eficiente.'},
 '3':{t:'Mesa 3 · ¿Puede la IA evaluar a tu gente?',
  caso:`<p><b>Retail Nacional S.A.</b> (empresa ficticia) tiene 4.000 empleados en 85 tiendas del país. Cada año, 300 jefes evalúan a sus equipos y se deciden unos 40 ascensos. Las quejas por favoritismo son frecuentes.</p>
  <p>Recursos Humanos propone que <b>una plataforma de IA haga la evaluación anual de desempeño</b> con datos de ventas, ausentismo, CRM y encuestas, y que <b>recomiende los 40 ascensos</b>. Los jefes solo aprobarían o rechazarían. La presidencia quiere su recomendación el lunes.</p>
  <p><b>Ustedes son el comité de gestión humana.</b></p>`,
  A:'Adoptar: la IA es más objetiva que 300 jefes con sus simpatías; los datos reducen el favoritismo y la evaluación se vuelve consistente.',

function vS6(){
 return `<span class="code">Seguimiento · 30 %</span><h1>Reporte del compromiso de la Sesión 6</h1>
 <p class="sub">El compromiso era sostener la conversación difícil o la negociación pendiente. Un análisis honesto de por qué no se cumplió también se valora.</p>
 <div class="card">${tx('s6_quien','Con quién era (rol, sin nombres)','')}${ta('s6_paso','Qué pasó','')}
 <label>¿La sostuve?</label>${chips('s6_sost',['Sí','Parcialmente','No'])}
 ${ta('s6_rel','Cómo cuidé la relación','')}${ta('s6_freno','Si no la tuve: qué me frenó','')}</div>
 ${next('todo','Entregar taller')}`}

function L(label,val){return val?`${label}: ${val}\n`:''}
function tallerText(){
 let t=`TALLER SESIÓN 7 · EL LÍDER EN TIEMPOS DE LA IA\nLiderazgo y Dirección de Equipos e Individuos · MBA · Pontificia Universidad Javeriana\nEstudiante: ${f('nombre')}\n\n`;
 t+=`1. PRODUCTO DE LA SESIÓN (40 %) · INVENTARIO DE DISPARADORES\n`;
 [1,2,3].forEach(i=>{if(f('i'+i+'_sit')){t+=`\nSituación ${i}: ${f('i'+i+'_sit')}\n`+L('Reacción inmediata',f('i'+i+'_re'))+L('Punto ciego que revela',f('i'+i+'_pc'))+L('Ajuste que me daría más criterio',f('i'+i+'_aj'))}});
 t+=L('\nLo que vio mi observador',f('co_vio'))+L('Lo que me llevo',f('co_llevo'));
 t+=`\n2. FICHA DE APRENDIZAJE (30 %)\n`+L('Aprendizaje',f('fa_apr'))+L('Buena práctica',f('fa_bp'))+L('Compromiso con fecha',f('fa_comp'));
 t+=`\n3. SEGUIMIENTO DEL COMPROMISO DE LA SESIÓN 6 (30 %)\n`+L('Con quién',f('s6_quien'))+L('Qué pasó',f('s6_paso'))+L('¿La sostuve?',v('s6_sost'))+L('Cómo cuidé la relación',f('s6_rel'))+L('Qué me frenó',f('s6_freno'));
 if(v('anexos')){
  t+=`\nANEXOS (no se califican)\n`;
  if(T()) t+='\n'+memoText()+'\n';
  t+=L('\nBitácora · acepté',f('f2_acepte'))+L('Bitácora · rechacé o corregí',f('f2_rechace'));
  t+=L('Mi ventaja como líder',f('ventaja'))+L('Cambio en mi delegación',f('d_cambia'));
  t+=L('Compromiso: si ocurre',f('k_disp'))+L('en lugar de',f('k_siempre'))+L('haré',f('k_hare'))+L('Primer intento',f('k_intento'));
 }
 t+=`\nDECLARACIÓN DE USO DE IA\n${f('ia_decl')||'(sin completar)'}\n`;
 return t}
function docHtml(){
 const body=esc(tallerText()).replace(/\n/g,'<br>');
 return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Taller S7</title></head><body style="font-family:Calibri,Arial;font-size:11pt"><p><img src="data:image/png;base64,${LOGO}" width="200" height="59"></p><p style="color:#B8891C"><b>Albeiro Herrera C.</b></p>${body}</body></html>`}
function vTodo(){
 const t=tallerText();
 hooks.push(()=>{
  document.getElementById('cpAll').onclick=()=>copyText(tallerText());
  document.getElementById('dlDoc').onclick=()=>{const blob=new Blob(['﻿'+docHtml()],{type:'application/msword'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Taller_S7_'+(f('nombre')||'estudiante').replace(/\s+/g,'_')+'.doc';document.body.appendChild(a);a.click();a.remove()};
  document.getElementById('mail').onclick=()=>{location.href='mailto:?subject='+encodeURIComponent('Taller Sesión 7 · '+f('nombre'))+'&body='+encodeURIComponent(tallerText().slice(0,1800))};
  document.getElementById('clr').onclick=()=>{const b=document.getElementById('clr');if(b.dataset.c){S={};save();toast('Kit borrado');go('inicio')}else{b.dataset.c=1;b.textContent='Toque otra vez para borrar todo'}}});
 const faltan=[];if(!DONE.espejo())faltan.push('8 · Espejo (dos situaciones con su ajuste)');if(!DONE.ficha())faltan.push('11 · Ficha');if(!DONE.s6())faltan.push('12 · Reporte S6');
 return `<h1>Entregar taller</h1>
 <p class="sub">Por correo hasta el <b>domingo 22 de noviembre, 11:59 p. m.</b> La parte privada del espejo no sale aquí.</p>
 ${faltan.length?`<div class="warn">Le falta: ${faltan.join(', ')}.</div>`:`<div class="ok">Las tres partes calificables están completas.</div>`}
 <div class="card">${ta('ia_decl','Declaración de uso de IA','Qué herramienta usé, en qué partes y para qué. Esta noche la IA se usó en clase; declare también cualquier uso posterior.')}
 <label><input type="checkbox" id="anx" ${v('anexos')?'checked':''}> Incluir anexos (memo de la mesa, bitácora, delegación y compromiso). No se califican.</label></div>
 <div class="row"><button class="btn btn-p" id="dlDoc">Descargar mi taller en Word</button><button class="btn btn-s" id="cpAll">Copiar todo</button><button class="btn btn-s" id="mail">Abrir correo</button></div>
 <p class="small" style="margin-top:8px">Lo más seguro: descargue el Word y adjúntelo a su correo.</p>
 <pre class="out">${esc(t)}</pre>
 <div class="row"><button class="btn btn-s" id="clr">Borrar mis datos de este dispositivo</button></div>`}
